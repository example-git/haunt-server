name: All-in-one container verification
on:
  push:
    tags: ['server-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version (defaults to the pinned client version)'
        required: false
        type: string
permissions:
  contents: read
jobs:
  build:
    outputs:
      version: ${{ steps.release.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - id: client
        run: echo "commit=$(git ls-tree HEAD client | awk '{print $3}')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: example-git/haunt-client
          ref: ${{ steps.client.outputs.commit }}
          path: client
          ssh-key: ${{ secrets.HAUNT_CLIENT_READ_KEY }}
      - id: release
        name: Select image version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          if [ -n "$REQUESTED_VERSION" ]; then
            version="$REQUESTED_VERSION"
          elif [[ "$RELEASE_REF" == server-v* ]]; then
            version="${RELEASE_REF#server-v}"
          else
            version=$(node -p 'require("./client/package.json").version')
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Image version must be major.minor.patch' >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Validate startup scripts
        run: shellcheck deploy/container/*.sh
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/${{ matrix.arch }}
          tags: haunt:check
          build-args: HAUNT_VERSION=${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/example-git/haunt
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            vg.xo.haunt.client-revision=${{ steps.client.outputs.commit }}
          cache-from: type=gha,scope=container-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=container-${{ matrix.arch }}
      - run: python3 scripts/test-container.py haunt:check
      - name: Export image
        run: |
          mkdir -p release
          docker save haunt:check | gzip > release/haunt-linux-${{ matrix.arch }}.docker.tar.gz
          cd release
          sha256sum *.docker.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: haunt-container-linux-${{ matrix.arch }}
          path: release/*
