name: Call endurance
on:
  workflow_dispatch:
    inputs:
      seconds:
        description: 'Observation seconds per transport (30-1800); two peers, sequential WebRTC and WebSocket'
        required: true
        type: number
        default: 900
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Require an explicit bounded duration
        env:
          SECONDS_REQUESTED: ${{ inputs.seconds }}
        run: |
          [[ "$SECONDS_REQUESTED" =~ ^[0-9]+$ ]] && [ "$SECONDS_REQUESTED" -ge 30 ] && [ "$SECONDS_REQUESTED" -le 1800 ]
  calls:
    needs: validate
    uses: ./.github/workflows/regression.yml
    with:
      soak_seconds: ${{ inputs.seconds }}
