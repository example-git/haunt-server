name: Server with embedded web client
on:
  push:
    tags: ['server-v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - id: client
        run: echo "commit=$(git ls-tree HEAD client | awk '{print $3}')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: example-git/haunt-client
          ref: ${{ steps.client.outputs.commit }}
          path: client
          ssh-key: ${{ secrets.HAUNT_CLIENT_READ_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: npm ci && npm run build
        working-directory: client
      - run: go test ./internal/httpapi -run TestEmbeddedWebClient
      - name: Build Linux binaries
        run: |
          mkdir -p release
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -tags webclient -trimpath -o "release/haunt-server-linux-$arch" ./cmd/haunt
          done
          cd release
          sha256sum haunt-server-* > SHA256SUMS
      - name: Build application update bundles
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          version=0.0.0
          if [[ "$RELEASE_REF" == server-v* ]]; then version="${RELEASE_REF#server-v}"; fi
          python3 scripts/package-container-app.py "$version"
          cd release
          sha256sum haunt-server-* haunt-app-* haunt-app.json > SHA256SUMS
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/server-v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --verify-tag --generate-notes --draft
          gh release upload "$RELEASE_TAG" release/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
      - uses: actions/upload-artifact@v4
        with:
          name: haunt-server
          path: release/*
