name: Repository hygiene
on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 scripts/check-repository.py
      - run: python3 scripts/check-docs.py
      - run: python3 scripts/test-backup.py
      - name: Check history for credentials
        shell: bash
        run: |
          set -euo pipefail
          audit_dir=$(mktemp -d "$RUNNER_TEMP/haunt-audit.XXXXXX")
          trap 'rm -rf "$audit_dir"' EXIT
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$audit_dir/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $audit_dir/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$audit_dir/gitleaks.tar.gz" -C "$audit_dir" gitleaks
          "$audit_dir/gitleaks" git --log-opts='--all --full-history' --redact --no-banner .
