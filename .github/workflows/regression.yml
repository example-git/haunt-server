name: Server regressions
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      soak_seconds:
        type: number
        default: 0
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      HAUNT_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:32768/chatxo_check?sslmode=disable
    steps:
      - name: Validate optional endurance duration
        env:
          SOAK_SECONDS: ${{ inputs.soak_seconds || 0 }}
        run: |
          if [ "$SOAK_SECONDS" != 0 ]; then
            [[ "$SOAK_SECONDS" =~ ^[0-9]+$ ]] && [ "$SOAK_SECONDS" -ge 30 ] && [ "$SOAK_SECONDS" -le 1800 ]
          fi
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Require media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg postgresql-client-16
          test -x /usr/bin/google-chrome
          ffmpeg -version
          ffprobe -version
      - name: Start isolated PostgreSQL
        run: |
          docker run -d --name chatxo-identity-check -p 127.0.0.1:32768:5432 \
            -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=chatxo_check \
            postgres:16-alpine > "$RUNNER_TEMP/haunt-regression-container"
          test "$(docker inspect chatxo-identity-check --format '{{.Config.Image}}')" = postgres:16-alpine
          test "$(docker port chatxo-identity-check 5432/tcp)" = 127.0.0.1:32768
          for _ in $(seq 1 60); do
            if docker exec chatxo-identity-check pg_isready -U postgres -d chatxo_check; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: npm ci
        working-directory: client
      - run: npm test && npm run test:version && npm run build
        working-directory: client
      - name: Check server contracts and tooling
        run: |
          go mod verify
          go vet ./...
          go run ./cmd/apidocs -check -client-out client/static/api
          python3 -m unittest discover -s scripts/tests
      - name: Run database, media and recovery regressions with race detection
        run: |
          mkdir -p test-results
          go test -race -p 2 -count=1 -timeout=8m -json ./... | tee test-results/server.jsonl
          python3 scripts/check-test-results.py test-results/server.jsonl
      - name: Check real browser workflows
        working-directory: client
        run: npm run test:browser
      - name: Build embedded server for both Linux targets
        run: |
          mkdir -p bin
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -tags webclient -trimpath -o "bin/haunt-server-linux-$arch" ./cmd/haunt
          done
      - name: Check standalone first-run setup
        run: |
          docker exec chatxo-identity-check createdb -U postgres haunt_wizard_test_ci
          HAUNT_WIZARD_TEST_DATABASE_URL='postgres://postgres@127.0.0.1:32768/haunt_wizard_test_ci?sslmode=disable' \
            HAUNT_WIZARD_TEST_BINARY="$PWD/bin/haunt-server-linux-amd64" \
            go test -race ./cmd/haunt -run '^TestFirstRunBinary$' -count=1 -v
      - name: Observe sustained browser calls on both transports
        if: inputs.soak_seconds > 0
        working-directory: client
        env:
          HAUNT_CALL_SOAK_SECONDS: ${{ inputs.soak_seconds }}
          HAUNT_CLIENT_CHECK: source-audio
        run: npm run test:integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-regression-evidence
          path: |
            test-results/
            client/test-results/
          retention-days: 14
      - name: Remove only this job's database container
        if: always()
        run: |
          if [ -s "$RUNNER_TEMP/haunt-regression-container" ]; then
            docker rm -f -v "$(cat "$RUNNER_TEMP/haunt-regression-container")"
          fi
