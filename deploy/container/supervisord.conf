[unix_http_server]
file=/run/haunt/supervisor.sock
chmod=0700

[supervisord]
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/haunt/supervisord.pid
childlogdir=/run/haunt
user=root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/haunt/supervisor.sock

[program:haunt]
command=/opt/haunt/start-haunt.sh
user=haunt
priority=20
autorestart=true
startsecs=2
startretries=3
stopsignal=TERM
stopwaitsecs=35
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -c /opt/haunt/nginx.conf -g 'daemon off;'
priority=30
autorestart=true
startsecs=2
startretries=3
stopsignal=QUIT
stopwaitsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:readiness]
command=/opt/haunt/readiness.sh
priority=40
autorestart=false
startsecs=0
stopwaitsecs=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[eventlistener:fatal]
command=python3 /opt/haunt/fatal-listener.py
priority=1
events=PROCESS_STATE_FATAL
buffer_size=20
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
