user nginx;
worker_processes 2;
pid /run/haunt/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    # Omit query strings: WebSocket and download URLs may contain credentials.
    log_format haunt '$remote_addr $request_method $uri $status $body_bytes_sent';
    access_log /dev/stdout haunt;
    sendfile on;
    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
    keepalive_timeout 65;
    client_body_timeout 60s;
    client_max_body_size 22m;
    map $http_upgrade $haunt_connection { default upgrade; '' close; }
    include /run/haunt/proxy-trust.conf;
    server {
        listen 127.0.0.1:8081;
        access_log off;
        location = /readyz { proxy_pass http://127.0.0.1:8080; }
        location / { return 404; }
    }
    include /run/haunt/listeners.conf;
}
