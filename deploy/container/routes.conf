root /data/apps/current/web;
location ^~ /.well-known/acme-challenge/ { root /run/haunt/acme; }
location ~ ^/api/v1/conversations/[0-9a-f-]+/attachments$ {
    # Live server quotas are authoritative; do not spool large uploads to disk.
    client_max_body_size 0;
    include /opt/haunt/proxy.conf;
}
location = /api/v1/admin/audio-plugins {
    client_max_body_size 50m;
    include /opt/haunt/proxy.conf;
}
location ~ ^/(api(?:/|$)|client-updates(?:/|$)|healthz$|readyz$|docs(?:/|$)|openapi\.json$|websocket\.json$|endpoints\.md$) {
    include /opt/haunt/proxy.conf;
}
location /assets/ {
    try_files $uri =404;
    include /opt/haunt/web-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
location = /index.html {
    include /opt/haunt/web-headers.conf;
    add_header Cache-Control no-store;
}
location = /haunt-build.json {
    include /opt/haunt/web-headers.conf;
    add_header Cache-Control no-store;
}
location ~ /\. { return 404; }
location / {
    try_files $uri $uri/ /index.html;
    include /opt/haunt/web-headers.conf;
    add_header Cache-Control no-cache;
}
