
[program:postgres]
command=postgres -D /data/postgres -c listen_addresses= -c unix_socket_directories=/run/postgresql
user=postgres
priority=10
autorestart=true
startsecs=2
startretries=3
stopsignal=INT
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
